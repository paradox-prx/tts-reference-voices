# qwen3-tts-server production deploy for Qwen/Qwen3-TTS-12Hz-1.7B-Base on ONE RTX 3090 (24 GiB, also drives the
# desktop; no other GPU tenant).
#
# A FULL copy of vllm_omni 0.28.0 deploy/qwen3_tts.yaml (sha256 02892b13...5632d). It is not a `base_config`
# overlay because 0.28 replaces the `connectors:` block wholesale in overlays (config/stage_config.py
# load_deploy_config/resolve_deploy_yaml, L677-700). Changes from upstream, everything else kept as shipped:
#   * stage 0 gpu_memory_utilization 0.3 -> 0.60, stage 1 0.3 -> 0.18 (arithmetic below)
#   * stage 0 enforce_eager: false written out (upstream leaves it unset; same value, CUDA graphs on)
#   * comments: the stage-0 max_num_batched_tokens note (upstream says 512, the 0.28 value is 32768)
# Precomputed voices (custom_voice_dir) live in the `custom_voices` variant (engine/make_variant.py).
#
# Placement: `devices: "0"` is a LOGICAL index into CUDA_VISIBLE_DEVICES (entrypoints/stage_utils.py
# set_stage_devices); engine/run_engine.sh exports CUDA_VISIBLE_DEVICES=${TTS_ENGINE_GPU:-0}.
#
# Memory (vllm_omni 0.28 worker/base.py determine_available_memory, worker/memory_utils.py):
#   * stage 0 asks for total * gpu_memory_utilization (total = 23.56 GiB from cudaMemGetInfo). If less is free at
#     start-up the request is CAPPED to the free memory with a warning (request_memory_tolerant), not refused.
#   * KV = that request - this process's NVML usage after the profiling run. The profiling activations are freed
#     by then, so the talker really peaks at request + activation peak + CUDA graphs.
#   * stage 1 (Code2Wav) has no attention KV: its fraction reserves and caps nothing; it simply uses what it
#     allocates (fp32 decoder in 0.28, per-stream decoder state, CUDA graphs).
# Measured on this box at 0.45 / 0.18 (logs/engine_smoke_prod.log, 2026-09-25, VLLM_USE_FLASHINFER_SAMPLER=0):
#   free at start 22.96 of 23.56 GiB (desktop); stage 0: model 3.89 GiB, weights + non-torch 4.15 GiB, activation
#   peak 1.5 GiB (max_num_batched_tokens 32768), CUDA graphs 0.17 GiB, "Available KV cache memory: 6.2 GiB",
#   "GPU KV cache size: 58,032 tokens" (= 112 KiB/token: 28 layers * 8 KV heads * 128 * 2 * bf16), so the process
#   holds ~4.40 GiB outside KV (10.60 - 6.2). After smoke requests nvidia-smi: stage 0 11.76 GiB, stage 1 3.44 GiB.
# This file, stage 0 at 0.60: request 0.60 * 23.56 = 14.14 GiB -> KV ~ 14.14 - 4.40 = 9.74 GiB predicted; MEASURED
#   (logs/engine_e03_*.log) "Available KV cache memory: 9.73 GiB", "GPU KV cache size: 91,120 tokens". After load
#   runs nvidia-smi showed stage 0 15.26 GiB, stage 1 3.58 GiB, card 19.17 of 24 GiB used (~4.4 GiB free).
#   No preemption (it can crash the engine or splice audio: vllm-omni #4471, #6179): max_num_seqs 64 must fit.
#   One take = ICL prompt (~11 + ref_code frames: trump 291 -> ~302, shehbaz 351 -> ~362 positions;
#   prompt_embeds_builder.py L1509-1600, default non_streaming_mode=false) + up to 875 codec frames (70 s, bench
#   xxlong) = <= 1,237 -> 1,248 tokens in 16-token blocks; 64 * 1,248 = 79,872 <= 91,120 (~11k spare for overlong
#   takes). non_streaming_mode=true also puts the reference + target text tokens in the prompt (+~0.3-1k).
#   Watch the engine log for "preempt" under load (none in the e03 runs).
# Card total: stage 0 peak ~15.8 (14.14 + 1.5 activations + 0.17 graphs) + stage 1 ~3.6-4.5 (grows with concurrent
#   streams; UNMEASURED at c=64) + desktop ~0.6 -> <= ~21 of 23.56 GiB, leaving >= 2.5 GiB (the desktop needs >= 1.5).
#
# vllm-omni 0.30.0rc1 reads this file too: `model_runner` is absent so it runs the V1 runner (0.30 upstream
# defaults to the experimental MRV2), and Code2Wav follows the stage dtype (auto -> bf16) instead of 0.28's
# forced fp32. See engine/make_variant.py --model-runner / --code2wav-dtype.
#
# Qwen3-TTS deploy: talker → code2wav via shared-memory chunk streaming.
# Verified on 1x H100.
#
# Fields omitted from a stage fall back to StageDeployConfig defaults (see
# vllm_omni/config/stage_config.py). Notable choices for this model:
#   * Stage 0 (talker) sets max_num_batched_tokens=32768 in 0.28 (upstream's
#     comment said 512; 0.30 lowered it to 512 for async-chunk first-chunk
#     latency, validated with its MRV2 profiles).
#   * Stage 1 (code2wav) sets max_num_batched_tokens=65536 for correctness:
#     codec prefill length (Q * num_frames) exceeds the 32k default.
#   * Stage 0 runs CUDA graphs (enforce_eager: false).
#     Stage 1 defaults to false so Code2Wav can use its inner cudagraph;
#     set true to disable that path in eager mode.
# The CLI flag --async-chunk / --no-async-chunk overrides this key (config/config_factory.py L456-458).
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # Must match the decoder sliding attention window.
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      # Emit only the first audio chunk early, then return to codec_chunk_frames.
      initial_codec_chunk_frames: 1
      # Chunk ramp (opt-in): gradual size increase for first N chunks to
      # eliminate the IC→steady cliff (1→25). Uncomment to enable.
      # Each entry is the size of that chunk index; indices past the table
      # fall back to codec_chunk_frames. When enabled, ramp overrides
      # initial_codec_chunk_frames (including the per-request API field).
      # Example:
      #   codec_chunk_ramp: [4, 4, 8, 16, 25]
      # Adaptive chunk ramp (opt-in, takes precedence over fixed codec_chunk_ramp):
      # Chunk 0 uses dynamic IC; chunk 1+ sizes from live buffer-depth feedback.
      # Self-tunes across hardware (NPU/NVIDIA) and load conditions.
      # codec_chunk_adaptive: true
      # codec_chunk_min_frames: 2
      # Code2Wav decode + transfer margin
      # codec_chunk_safety_margin_ms: 50
      # EWMA->delta divisor (delta=max(delta_min, int(ewma/divisor))); higher=gentler ramp
      # codec_chunk_ramp_divisor: 15
      # min chunk-size growth per emit
      # codec_chunk_ramp_delta_min: 2
      # Decoder CUDA Graph sizing:
      #   * async_chunk=true derives all stateful ICL/xvec shapes from
      #     codec_chunk_ramp when enabled, otherwise from
      #     initial_codec_chunk_frames, codec_chunk_frames, and sliding_window;
      #     decode_cudagraph_capture_sizes is ignored in this mode.
      #   * async_chunk=false captures stateless shapes 150 and
      #     decode_chunk_frames + decode_left_context_frames (325 by default).
      #     Extra stateless shapes may be added (union, not intersection) with:
      #       decode_cudagraph_capture_sizes: [97, 400]
      # Graph batch size defaults to 1. Add larger buckets only when needed:
      #   decode_cudagraph_batch_sizes: [1, 2, 4]
      # Limit eager batches to reduce temporary stateful cache allocations; CUDA Graph batching uses the buckets above.
      decode_batch_max_size: 4

stages:
  - stage_id: 0
    max_num_seqs: 64
    # 0.60 of the card (KV 91,120 tokens measured: 64 takes of <= 70 s): see the arithmetic at the top.
    gpu_memory_utilization: 0.60
    trust_remote_code: true
    # Prefix caching on by default. The HS opt-out (talker only consumes the
    # last token's hidden state) and deferred mm-output writes added in this
    # PR make per-step bookkeeping negligible, and any text repetition across
    # requests (same voice or shared ref_audio) is a net throughput win.
    # Disable explicitly if memory headroom is tight on a single-GPU deploy.
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 32768
    max_model_len: 4096
    # CUDA graphs for the talker and the code predictor (upstream leaves this unset: same default).
    enforce_eager: false
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    # Talker (codebook 0) sampling defaults = the checkpoint's generation_config.json. Per request, extra_params
    # {temperature, top_p, top_k} override them; repetition_penalty needs engine/patches (apply_patches.py).
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      # Official qwen-tts generates the talker with min_new_tokens=2; without
      # it, checkpoints that sample codec EOS on the first frame return empty
      # audio (HTTP 400). See #4962.
      min_tokens: 2
      repetition_penalty: 1.05
    # Suppress codebook-0 silence tokens for the first N decode frames of a
    # request (#4966). Applies to every request on this stage, so intended
    # for x-vector-only (Base voice-clone) deploys. 0 = off.
    silence_ban_frames: 0
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    # Tuned for Base voice clone; CustomVoice / VoiceDesign are TTFA-optimal at 1.
    max_num_seqs: 64
    # Not a reservation for Code2Wav (no attention KV): it uses ~3.5 GiB idle whatever this says. See the top.
    gpu_memory_utilization: 0.18
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    # Must be divisible by num_code_groups and cover (left_context + chunk).
    # Prefill length is Q * num_frames (e.g. 16 * 2148 = 34368); keep
    # headroom past 32k.
    max_num_batched_tokens: 65536
    # async_chunk appends windows per step; max_model_len must cover the
    # accumulated flat codec stream.
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0

platforms:
  rocm:
    stages:
      - stage_id: 1
        # MIOpen Conv1d cannot be invoked while vLLM captures the outer
        # Code2Wav model graph. Keep CUDA's graph-enabled default, but run
        # Stage 1 eager on ROCm so decoder convolutions execute normally.
        enforce_eager: true
  npu:
    stages:
      - stage_id: 0
        enforce_eager: false
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 1
        compilation_config:
          cudagraph_mode: PIECEWISE
