[project]
name = "tts-gateway"
version = "0.1.0"
description = "Production gateway for voice-clone TTS (Qwen3-TTS on vLLM-Omni): auth, admission, retries, labels, metrics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=2",
    "soundfile>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "orjson>=3.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
