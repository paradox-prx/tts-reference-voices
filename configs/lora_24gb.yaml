# LoRA (r=64 on all linear layers of talker + code predictor; codec embedding and text projection fully trained).
# Lighter and safer against forgetting than a full fine-tune; use it if the full fine-tune hurts English or cloning.
model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
data_dir: data/urdu300
out_dir: runs/urdu_lora_a
mode: lora
precision: bf16
lora: {r: 64, alpha: 128, dropout: 0.05}
lr: 1.0e-4
warmup_steps: 300
schedule: cosine
epochs: 4
max_tokens: 8000
max_batch: 8
grad_accum: 4
clip: 1.0
language: {name: urdu, row: 2080, p: 0.8, init: mean}
icl: {p: 0.7, ref_min_s: 3.0, ref_max_s: 20.0, train_on_ref: false}
eval_every: 500
save_every: 2000
keep_last: 2
num_workers: 6
