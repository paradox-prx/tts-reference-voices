# Full fine-tune of the 1.7B talker on one 24 GB card (RTX 3090/4090): bf16 weights + Kahan AdamW, ~14 GB + activations.
model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
data_dir: data/urdu300
out_dir: runs/urdu_full_a
mode: full
precision: bf16
lr: 5.0e-6
weight_decay: 0.01
warmup_steps: 500
schedule: cosine
min_lr_ratio: 0.1
epochs: 4
max_tokens: 8000      # ~4-6 utterances of 12 s with a reference each
max_batch: 8
grad_accum: 4         # ~24 utterances per optimizer step
clip: 1.0
cp_weight: 0.3
grad_checkpointing: true
train_text_embedding: false
language: {name: urdu, row: 2080, p: 0.8, init: mean}
icl: {p: 0.7, ref_min_s: 3.0, ref_max_s: 20.0, train_on_ref: false}
stream_p: 0.0
eval_every: 500
save_every: 2000
keep_last: 2
save_optimizer: true
num_workers: 6
